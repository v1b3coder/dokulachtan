name: Dokulachtan
summary: Podepisuj PDF z mobilu kvalifikovaným certifikátem, klíč zůstává v telefonu.
description: |
  Dokulachtan je doprovodná appka k upravenému [DocuSeal](https://github.com/v1b3coder/docuseal).
  Podepisuješ a ověřuješ dokumenty z mobilu kvalifikovaným certifikátem od českých
  kvalifikačních autorit (iSignum/I.CA, PostSignum) — **klíč zůstává v zařízení a na server
  se nikdy nenahraje**. Server vidí jen hash a podpis.

  - **Podpis dokumentu z e-mailu** — firma pošle PDF s polem „Podpis certifikátem“; dokument
    zkontroluješ, potvrdíš otiskem prstu nebo PINem a stav podpisu firma vidí v DocuSealu.
  - **Přímý podpis PDF** — PDF z e-mailu, z WhatsAppu nebo z portálu vybereš přímo v appce,
    umístíš pečeť a podepíšeš.
  - **Ověření PDF** — appka řekne, jestli je podpis platný, kdo ho udělal a jestli se soubor
    po podpisu nezměnil. Volitelně přes veřejné API EU DSS.
  - **Vícenásobné podpisy** — každý podepisující má vlastní pole a vlastní relaci; podpisy
    jdou po sobě a řetězí se jako PAdES revize.
  - **Import PKCS#12** — heslo zadáváš jen při importu, pak už jen biometrií; klíč je šifrovaný
    AES-256-GCM a odemyká se biometrií.

  Dokumenty, e-maily, historie i audit zůstávají ve tvém DocuSealu, ke kterému se appka připojí
  přes API (Server URL + API token). Dokumenty se do appky neukládají.

  **Zatím neumí:** QES s čipem eObčanky (chybí reálná čtečka, MOI Podpisové SDK), kvalifikované
  časové razítko (dnes DigiCert free) a iOS build (čeká na Apple Developer účet).
