name: Android APK release

# Tag ve tvaru v1.3.2 → build APK + release s přiloženým APK.
# Běží na GitHubu i na Gitea Actions (Gitea čte .github/workflows a je
# kompatibilní se syntaxí GitHub Actions); release krok se podle hostu rozhodne
# mezi `gh` (GitHub) a REST API Gitea, protože `gh` s Giteou neumí mluvit.
# Podpis: release keystore z CI secrets; lokální buildy používají debug keystore.
# Keystore se generuje mimo repo (deploy/android-release/, gitignored).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json

      - name: Verze a tag
        working-directory: mobile/app
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            VERSION="$VERSION" VERSION_CODE="$VERSION_CODE" node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              config.expo.version = process.env.VERSION;
              config.expo.android.versionCode = Number(process.env.VERSION_CODE);
              fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
            "
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            VERSION=$(node -p "require('./app.json').expo.version")
            VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
            echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Připravit release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Chybí secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Nainstalovat závislosti
        working-directory: mobile/app
        run: npm ci

      - name: Vygenerovat android projekt
        working-directory: mobile/app
        env:
          EXPO_NO_GIT_STATUS: 1
        run: npx expo prebuild --platform android --no-install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Sestavit APK
        working-directory: mobile/app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Připravit APK
        run: |
          cp mobile/app/android/app/build/outputs/apk/release/app-release.apk \
            "dokulachtan-signer-${RELEASE_TAG}.apk"
          echo "APK_NAME=dokulachtan-signer-${RELEASE_TAG}.apk" >> "$GITHUB_ENV"

      - name: Ověřit release podpis
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$ANDROID_RELEASE_CERT_SHA256" ]; then
            echo "Chybí secret ANDROID_RELEASE_CERT_SHA256" >&2
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK_NAME" | awk -F': ' '/SHA-256/{print $3; exit}' | tr 'A-F' 'a-f')"
          EXPECTED="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          echo "APK SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "APK není podepsané release certifikátem" >&2
            exit 1
          fi

      - name: Vytvořit release
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_SERVER_URL" = "https://github.com" ]; then
            if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
            else
              gh release create "$RELEASE_TAG" "$APK_NAME" \
                --title "$RELEASE_TAG" --generate-notes
            fi
            exit 0
          fi

          # Gitea: gh umí jen GitHub, použij REST API (GITHUB_API_URL = <instance>/api/v1)
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          AUTH="Authorization: token $TOKEN"
          RELEASE_ID=$(curl -sS -H "$AUTH" "$API/tags/$RELEASE_TAG" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -sS -f -X POST "$API" -H "$AUTH" \
              -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"$RELEASE_TAG\"}" | jq -r .id)
          else
            for id in $(curl -sS -H "$AUTH" "$API/$RELEASE_ID/assets" \
              | jq -r ".[] | select(.name == \"$APK_NAME\") | .id"); do
              curl -sS -f -X DELETE "$API/$RELEASE_ID/assets/$id" -H "$AUTH"
            done
          fi
          curl -sS -f -X POST "$API/$RELEASE_ID/assets?name=$APK_NAME" \
            -H "$AUTH" -F "attachment=@$APK_NAME"
